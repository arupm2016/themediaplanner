name: Build and deploy The Media Planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Smoke test production bundle
        run: npm run test:smoke
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable GitHub Pages if not configured
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"build_type":"workflow"}')
          echo "Pages configuration API returned HTTP ${code}"
          cat /tmp/pages-response.json
          if [ "${code}" = "201" ] || [ "${code}" = "409" ] || [ "${code}" = "422" ]; then
            echo "Pages is enabled or already configured."
          else
            echo "The token cannot enable Pages automatically; deployment will still be attempted."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
